<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tourist From Almaty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/src/style.css" />
  <!-- Menu music: fetched via musicManager.js's fetch()+decodeAudioData()
       (see main.js's setMusicForState('MENU'), called at module-load time),
       not a plain <audio> element — as="fetch" (+ crossorigin) matches that
       request type so the browser actually reuses this preload instead of
       double-fetching; as="audio" only gets reused by a real <audio>/<video>
       element request. Gives the browser a head start alongside the HTML
       parse, before any JS (including the module script) has run. -->
  <link rel="preload" href="/audio/music/background.mp3" as="fetch" crossorigin />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <canvas id="panic-freeze"></canvas>
    <canvas id="hud"></canvas>
    <div id="blackout"></div>
    <div id="fps-counter"></div>
    <div id="pointer-lock-hint">Mouse to steer, W/S or Shift/Ctrl for throttle, F toggles FPS &mdash; click to regain mouse control</div>
    <div id="route-hud" class="hidden"></div>

    <div id="menu-shell" class="hidden">
      <video id="menu-video" muted loop playsinline autoplay preload="auto"></video>
      <div id="menu-dim"></div>
      <div id="menu-vignette"></div>
      <div id="menu-content">
        <div id="menu-title">
          <img id="menu-logo" src="/img/logo.png" alt="" />
          <div id="menu-wordmark">Tourist From Almaty</div>
          <div id="menu-tagline">3D Arcade Flight &middot; ALA &rarr; IST</div>
        </div>
        <div id="splash-bottle" aria-hidden="true">
          <div id="splash-bottle-neck"></div>
          <div id="splash-bottle-body"></div>
        </div>
        <div id="splash-prompt">Press To Start</div>
        <div id="menu-rule"></div>
        <div id="menu-screens"></div>
        <div id="menu-status-strip">LEGS 05 &middot; DISTANCE 4320 KM &middot; WEAPONS NONE &middot; DUTY-FREE 1 BOTTLE</div>
      </div>
    </div>

    <div id="pause-overlay" class="hidden">
      <div id="pause-screens"></div>
    </div>

    <div id="panic-overlay" class="hidden">
      <div id="panic-screens"></div>
    </div>

    <div id="cutscene" class="hidden">
      <div id="cutscene-frame">
        <div id="cutscene-subtitle"></div>
        <div id="cutscene-skip" class="hidden">Пропустить</div>
      </div>
    </div>
    <div id="finale-fade"></div>
    <div id="credits" class="hidden"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
